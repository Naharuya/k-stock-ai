name: Android external access
on:
  pull_request:
    branches: [master]
    paths: ['android/**', 'test/android_external.test.js', '.github/workflows/android.yml']
  push:
    branches: [master]
    paths: ['android/**', 'test/android_external.test.js', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - name: Compile release without embedded credentials
        run: node android/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: kstock-android-unsigned-${{ github.sha }}
          path: android/build/release/k-stock-ai-2.6.5-unsigned.apk
          if-no-files-found: error
